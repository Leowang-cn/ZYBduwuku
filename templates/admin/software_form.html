{% extends "base.html" %}
{% block title %}{{ '编辑' if item else '新增' }}软件 · 软件驿站{% endblock %}
{% block content %}<div class="admin-layout">{% include "admin/_nav.html" %}<section class="admin-content narrow"><a class="back-link" href="{{ url_for('admin_software') }}">← 返回软件管理</a><div class="section-heading"><div><p class="eyebrow">{{ 'EDIT' if item else 'NEW SOFTWARE' }}</p><h1>{{ '编辑软件' if item else '新增软件' }}</h1></div></div><form class="editor-form" method="post" enctype="multipart/form-data"><div class="form-section"><h2>基本信息</h2><div class="form-grid"><label class="span-2">软件名称<input name="name" required maxlength="100" value="{{ item.name if item else '' }}" placeholder="例如：桌面效率助手"></label><label>版本号<input name="version" maxlength="40" value="{{ item.version if item else '' }}" placeholder="2.4.1"></label><label>分类<input name="category" maxlength="60" value="{{ item.category if item else '效率工具' }}"></label><label class="span-2">一句话简介<input name="summary" required maxlength="200" value="{{ item.summary if item else '' }}" placeholder="告诉大家它解决什么问题"></label><label class="span-2">详细说明<textarea name="description" required maxlength="5000" rows="8" placeholder="功能、安装方法、注意事项等">{{ item.description if item else '' }}</textarea></label><label>图标代号<input name="icon" maxlength="40" value="{{ item.icon if item else 'box' }}" placeholder="box"></label><label class="checkbox"><input type="checkbox" name="is_featured" {% if item and item.is_featured %}checked{% endif %}><span>在首页优先推荐</span></label></div></div><div class="form-section"><h2>文件与视频</h2><div class="form-grid"><label class="span-2">安装包 {% if item and item.file_name %}<span class="optional">当前：{{ item.file_name }}</span>{% endif %}<input type="file" name="package" accept=".apk,.deb,.dmg,.exe,.gz,.msi,.pkg,.rar,.rpm,.tar,.zip"><small>支持常见桌面与移动端安装包，最大容量由 MAX_UPLOAD_MB 控制。</small></label><label class="span-2">视频嵌入 URL<input type="url" name="video_url" maxlength="500" value="{{ item.video_url if item else '' }}" placeholder="https://..."><small>请使用视频平台提供的嵌入地址，普通播放页可能拒绝 iframe 加载。</small></label></div></div><div class="form-actions"><button class="button primary" type="submit">保存软件</button><a class="button ghost" href="{{ url_for('admin_software') }}">取消</a></div></form></section></div>{% endblock %}

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --address :9000 --console-address :9001
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run scripts/minio-dev.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run scripts/minio-dev.sh first}
    volumes:
      - ./data/minio-dev:/data
